<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="im-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563EB" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="120" height="120" rx="28" fill="url(#im-grad)" filter="url(#glow)" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="1" y="1" width="118" height="118" rx="27" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- Iconic Ironman M-Dot Emblem in Pure White -->
  <g fill="#FFFFFF">
    <!-- The Head / Dot -->
    <circle cx="60" cy="34" r="13" />
    
    <!-- The Muscular M Body -->
    <path d="M 24 96 L 24 54 L 40 54 L 60 74 L 80 54 L 96 54 L 96 96 L 82 96 L 82 72 L 60 92 L 38 72 L 38 96 Z" />
  </g>
</svg>
